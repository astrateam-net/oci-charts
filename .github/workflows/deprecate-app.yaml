---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Deprecate Chart

on:
  workflow_dispatch:
    inputs:
      chartName:
        type: string
        description: Chart Name (directory name under `apps/`)
        required: true
      reason:
        type: string
        description: Deprecation Reason
        required: true
      release:
        type: boolean
        description: Create Release
        default: true

permissions: {}

jobs:
  plan:
    name: Plan (${{ inputs.chartName }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull-number: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Chart Directory
        env:
          CHART_NAME: ${{ inputs.chartName }}
        run: |
          if [[ ! -d "./apps/${CHART_NAME}" ]]; then
            echo "::error::Chart directory './apps/${CHART_NAME}' does not exist"
            exit 1
          fi

      - name: Delete Chart
        env:
          CHART_NAME: ${{ inputs.chartName }}
        run: |
          rm -rf "./apps/${CHART_NAME}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          body: |
            **Reason**: ${{ inputs.reason }}
          branch: deprecate/${{ inputs.chartName }}
          commit-message: "feat: deprecate ${{ inputs.chartName }}"
          sign-commits: true
          signoff: true
          title: "feat: deprecate ${{ inputs.chartName }}"
          token: ${{ github.token }}

  merge:
    if: ${{ inputs.release && needs.plan.outputs.pull-number != '' }}
    name: Merge (${{ inputs.chartName }})
    needs:
      - plan
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge Pull Request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PULL_NUMBER: ${{ needs.plan.outputs.pull-number }}
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PULL_NUMBER),
              merge_method: 'squash',
            });

  announce:
    if: ${{ inputs.release }}
    name: Announce (${{ inputs.chartName }})
    needs:
      - merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Get Release Tag
        uses: ./.github/actions/release-tag
        id: release
        with:
          token: ${{ github.token }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          CHART_NAME: ${{ inputs.chartName }}
          REASON: ${{ inputs.reason }}
        run: |-
          cat > release-notes.md <<EOF
          > [!WARNING]
          > A chart has been deprecated and will no longer receive updates.
          > After **6 months** from now, its image will be **removed** from our container registry.

          ## 📦 Chart

          **Name**: ${CHART_NAME}
          **Reason**: ${REASON}
          EOF
          gh release create "$TAG" --notes-file release-notes.md
